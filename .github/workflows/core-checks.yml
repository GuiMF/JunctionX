name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m scripts.demo --in-process
      - run: python -m scripts.evaluate_source
      - run: python -m scripts.scan_source tests/fixtures/source --synthetic --output reports/source.json --cyclonedx-dir reports/source-cbom
      - name: Verify generated contracts and examples are current
        run: |
          python -m scripts.generate_contract
          git diff --exit-code -- schemas examples
