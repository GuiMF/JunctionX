name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m scripts.demo --in-process
      - run: python -m scripts.evaluate_source --strict
      - run: python -m scripts.scan_source tests/fixtures/source --synthetic --output reports/source.json --cyclonedx-dir reports/source-cbom
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run test:integration --prefix web
      - run: npm run build --prefix web
      - name: Verify generated contracts and examples are current
        run: |
          python -m scripts.generate_contract
          git diff --exit-code -- schemas examples web/src/types/generated.ts
          if [ -n "$(git ls-files --others --exclude-standard -- schemas examples web/src/types/generated.ts)" ]; then
            echo "Generated contracts or examples are missing from version control."
            git ls-files --others --exclude-standard -- schemas examples web/src/types/generated.ts
            exit 1
          fi

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the deployment image with TShark
        run: docker build --file Dockerfile.vercel --tag quantumtrace-ci .
      - name: Start the deployment image
        run: docker run --detach --name quantumtrace-ci --publish 127.0.0.1:8000:80 quantumtrace-ci
      - name: Verify health, scanners, uploads, and exports over HTTP
        run: python -m scripts.smoke_deployment --base-url http://127.0.0.1:8000
      - name: Show container logs
        if: always()
        run: docker logs quantumtrace-ci || true
      - name: Stop the test container
        if: always()
        run: docker rm --force quantumtrace-ci || true
